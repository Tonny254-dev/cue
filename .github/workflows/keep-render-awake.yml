# Ping production every 5 minutes so Render free tier does not cold-sleep.
name: Keep Render awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake cue-backend
        run: |
          curl -fsS --max-time 60 "https://cue-backend-rd5t.onrender.com/healthz" || true
          curl -fsS --max-time 60 "https://cue-backend-rd5t.onrender.com/api/docs/" || true
