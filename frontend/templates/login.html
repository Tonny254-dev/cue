<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – AquaPulse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/aquapulse.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: var(--bg-body);">

  <div class="ap-card p-5" style="width: 100%; max-width: 420px;">
    <div class="text-center mb-4">
      <a href="index.html" class="text-decoration-none">
        <i class="bi bi-droplet-fill text-primary" style="font-size: 3rem;"></i>
      </a>
      <h3 class="fw-bold mt-2">AquaPulse</h3>
      <p class="text-muted">Sign in to your dashboard</p>
    </div>

    <div id="loginAlert" class="alert d-none" role="alert"></div>

    <div class="alert alert-info py-2 small border-info">
      <strong><i class="bi bi-info-circle me-1"></i> Demo Mode</strong><br>
      Email: <code>demo@aquapulse.io</code><br>
      Password: <code>AquaPulse123</code>
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control" id="email" placeholder="demo@aquapulse.io" required>
      </div>
      
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="position-relative">
          <input type="password" class="form-control pe-5" id="password" placeholder="Enter password" required>
          <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y text-muted border-0" id="togglePassword">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="loginBtn">
        <span id="loginBtnText">Sign In</span>
        <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
