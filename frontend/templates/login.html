<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – AquaPulse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/aquapulse.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-body);
      color: var(--text-main);
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <div class="login-card card border-0">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-droplet-fill text-primary" style="font-size:2.75rem;"></i>
        <h1 class="h4 fw-bold mt-2 mb-1">AquaPulse</h1>
        <p class="text-muted small mb-0">Water Monitoring System</p>
      </div>

      <div id="loginError" class="alert alert-danger d-none small py-2"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold small">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" name="username"
                   autocomplete="username" placeholder="Enter your username" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold small">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" placeholder="Enter your password" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1">
              <i class="bi bi-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
          <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
        </button>
      </form>

      <p class="text-center text-muted small mt-4 mb-0">
        &copy; <span id="year">2026</span> AquaPulse · MAWASCO
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Eye toggle
    var pwd = document.getElementById('password');
    var icon = document.getElementById('togglePasswordIcon');
    document.getElementById('togglePassword').addEventListener('click', function () {
      var show = pwd.type === 'password';
      pwd.type = show ? 'text' : 'password';
      icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
  </script>
</body>
</html>
