<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – AquaPulse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/aquapulse.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card">
      <a href="index.html" class="auth-brand">
        <i class="bi bi-droplet-fill"></i> AquaPulse
      </a>
      <p class="auth-subtitle">Reset your password</p>

      <div id="authAlert" class="alert auth-alert" role="alert"></div>

      <form id="forgotForm" novalidate>
        <div class="mb-3">
          <label for="email" class="auth-label">Email address</label>
          <div class="auth-input-group">
            <input type="email" class="form-control" id="email"
                   autocomplete="email" placeholder="you@example.com" required>
          </div>
        </div>

        <button type="submit" class="btn btn-ap-primary w-100" id="forgotBtn">
          <span id="forgotBtnText">Send reset link</span>
          <span id="forgotSpinner" class="spinner-border spinner-border-sm ms-2 d-none"
                role="status" aria-hidden="true"></span>
        </button>
      </form>

      <div id="successBox" class="auth-success-box mt-3">
        <i class="bi bi-check-circle me-1"></i>
        <span id="successMessage"></span>
      </div>

      <div class="auth-footer">
        <a href="login.html" class="auth-link">
          <i class="bi bi-arrow-left me-1"></i>Back to sign in
        </a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/validators.js"></script>
  <script src="js/utils/notifications.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/services/auth-service.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
